name: "HACS Action"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: "Validate HACS & Code"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "HACS Action"
        uses: hacs/action@main
        with:
          category: "plugin"

      - name: "Verify JavaScript Syntax"
        run: |
          node -c climate-card.js
